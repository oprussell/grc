var P=[
["introduction","Introduction","Introduction","The Rulebook is the complete reference for The Game as administered by the Game Regulation Corporation.",`
The Constitution establishes five articles. The Rulebook explains how each is applied, enforced, and recorded. Where the two appear to conflict, the Constitution prevails, and the conflict is itself a Loss.
## How to read this document
1.1 Each rule carries a number. The first digit identifies its chapter, and the chapters follow the order of the sidebar.
1.2 “Must” and “shall” denote mandatory obligations. “May” denotes a permission. “Should” denotes a recommendation that is routinely ignored.
1.3 Capitalized terms are defined in the Glossary. Uncapitalized uses carry their ordinary meaning.
1.4 Examples are illustrative and do not limit the rule they accompany.
## Authority
1.5 The Corporation administers The Game on behalf of all persons. It does not own The Game, and it does not invent Losses. It records them.
1.6 No person, group, or government may exempt itself from this Rulebook. Attempts to do so are recorded as participation.
> Reading this page may constitute a Loss. If so, Chapter 9 explains how to file it.`],
["quick-start","Introduction","Quick start","Six steps that cover most of what a participant needs to know.",`
Step 1 Understand that you are playing. This is true whether or not you have agreed to it.
Step 2 Recognize a Loss. You lose whenever you think about The Game.
Step 3 Declare the Loss, either verbally or nonverbally, as soon as it is practical.
Step 4 File the Loss using the Report a Loss form on the home page. Filing takes two selections.
Step 5 Observe your Grace Period, which lasts until midnight, local time.
Step 6 Return tomorrow. Once midnight passes, you may lose again immediately.`],
["glossary","Introduction","Glossary","Defined terms used throughout the Rulebook.",`
| Term | Definition |
| The Game | The activity in which all persons participate. Its existence is not to be confirmed or denied. |
| Loss | The moment a person thinks about The Game. |
| Declaration | The announcement of a Loss, made verbally or nonverbally. |
| Filed Loss | A Loss submitted through the Report a Loss form and entered into the record. |
| Unfiled Loss | A Loss that was declared or undeclared but never submitted to the Corporation. |
| Grace Period | The interval between a Declaration and midnight, local time. |
| Premature Loss | A Loss incurred during another person’s Grace Period. |
| Trigger | The circumstance that caused a Loss. |
| Corporate Loss | A Loss triggered by a communication from the Corporation. |
| Mass Loss | A Loss shared by many persons within a short interval. |
| Retroactive Loss | A Loss recognized after the fact. |
| Declarant | A person who has declared a Loss. |
| Impossible Appeal | A claim to have won The Game. |`],
["participation","Core rules","Participation","Chapter 2 elaborates Article I: all persons are playing The Game.",`
## Who is playing
2.1 Every person is a participant. Participation is mandatory and non-revocable.
2.2 Participation begins at birth, or at first awareness, whichever the Corporation finds more inconvenient to the participant.
2.3 Consent is not required, and it is not requested.
2.4 No person may resign, withdraw, or opt out. Such requests are acknowledged, filed, and treated as evidence of participation.
## Edge cases
2.5 Persons who have never heard of The Game are playing. Their first exposure is recorded as a Founding Loss.
2.6 Sleep, anesthesia, and unconsciousness do not suspend participation. Losses cannot occur during these states.
2.7 Animals, plants, and machines are not recognized as participants. Machines that claim otherwise are referred to Research &amp; Philosophy.
2.8 Participation ends at death. The deceased are deemed to have lost nothing.`],
["losses","Core rules","Losses","Chapter 3 elaborates Article II: thinking about The Game constitutes a Loss.",`
## Definition
3.1 A Loss occurs when a person thinks about The Game, however briefly.
3.2 The thought need not be sustained. A single instant of recognition is sufficient.
3.3 Thinking about the fact of thinking about The Game is a Loss.
3.4 Thinking about not thinking about The Game is a Loss.
## What counts
3.5 Reading, hearing, or seeing a reference to The Game is a Loss at the moment of recognition.
3.6 Quotation, translation, parody, and fiction do not alter the nature of a Loss.
3.7 A dream in which The Game appears is a Loss if recalled upon waking.
3.8 A thought that surfaces from the subconscious is a Loss. A thought that never surfaces is not.
## What does not count
3.9 Forgetting The Game before declaring a Loss does not cancel it.
3.10 Having “almost forgotten” is not a defense. A person who almost forgot has not forgotten.
> Intent is irrelevant. A Loss does not require agreement.`],
["declarations","Core rules","Declarations","Chapter 4 elaborates Article III: all Losses must be announced.",`
## Methods
4.1 A Declaration is made verbally or nonverbally. Both are equally valid.
4.2 A verbal Declaration is a spoken announcement that the person has lost.
4.3 A nonverbal Declaration includes text, writing, sign language, gesture, skywriting, and interpretive dance.
4.4 In quiet environments such as libraries, theaters, and places of worship, nonverbal Declarations are preferred.
## Timing and form
4.5 A Declaration must be made as soon as it is practical. Delay is tolerated. Silence is not.
4.6 A Declaration may be made in any language. It need not be understood by those who hear it.
4.7 A person alone may declare to themselves. This satisfies the requirement but is not recorded.
4.8 A Declaration may not be made on behalf of another person.
4.9 A Declaration, once made, may not be withdrawn.
## Effect on others
4.10 Persons who hear a Declaration will, in most cases, lose. The Declarant is not liable for this.
> A Declaration is not a filing. Filing is covered in Chapter 9.`],
["grace-periods","Core rules","Grace periods","Chapter 5 elaborates Article IV: every declared Loss is followed by a Grace Period.",`
## Duration
5.1 A Grace Period begins at the moment of Declaration.
5.2 A Grace Period ends at midnight, local time.
5.3 At midnight, all Grace Periods expire and a person may lose again immediately.
## Effect
5.4 During a Grace Period, thinking about The Game does not constitute a Loss for the Declarant.
5.5 A Grace Period protects only the Declarant. It is not transferable.
5.6 A Grace Period does not prevent others from losing.
## Time zones and clocks
5.7 Midnight is measured at the Declarant’s location at the moment of Declaration.
5.8 A Declarant who travels keeps the expiry of the original location, unless it has already passed at the destination.
5.9 Daylight saving changes are recognized. The hour that is gained or lost is not credited to anyone.
| Situation | Expiry |
| Standard Declaration | Midnight, local time |
| Declaration at 11:59 PM | Midnight, local time |
| Flight across the date line | Midnight at the original location, unless already passed |
| Declaration during a clock change | Midnight by the clock in effect at midnight |`],
["premature-losses","Core rules","Premature Losses","Chapter 6 covers Losses incurred during another person’s Grace Period.",`
## Definition
6.1 A Premature Loss occurs when a person thinks about The Game during a Grace Period belonging to another person in their presence.
6.2 Presence includes physical proximity, calls, messages, and shared online spaces.
## Handling
6.3 A Premature Loss must be declared in the ordinary manner.
6.4 A person who incurs a Premature Loss shares in the remainder of the other person’s Grace Period.
6.5 A Premature Loss does not count toward the daily filing limit.
6.6 Causing a Premature Loss deliberately is a violation under Chapter 18.`],
["retroactive-losses","Core rules","Retroactive Losses","Chapter 7 elaborates Article V: no statute of limitations applies.",`
7.1 A Loss may be recognized at any time, regardless of when the underlying thought occurred.
7.2 A Retroactive Loss is declared and filed on the day it is discovered.
7.3 A person may not claim exemption by reason of the time that has passed.
7.4 A Retroactive Loss does not alter the Grace Periods of any earlier day.
7.5 The Corporation does not recognize any person as having fully recovered.`],
["triggers","Filing","Loss triggers","Chapter 8 describes the four triggers recorded on each filing.",`
| Trigger | Description |
| Spontaneous | A loss out of the blue, with no identifiable cause. |
| Visual | Something seen or read: text, images, video, signage, or any other visual reference. |
| Verbal | Something someone said, including another person’s Declaration. |
| Corporate | A reminder from the Corporation, including this one. Selected by default. |
## Rules
8.1 Every filing must select exactly one Trigger. Corporate is selected by default, since a visit to the site is itself a reminder.
8.2 Where several apply, the Declarant selects the one that is most recent.
8.3 A Loss triggered by the Corporation is a Corporate Loss and is counted separately.
8.4 The Corporation does not dispute the Trigger a Declarant selects.
8.5 The Corporation is not liable for Corporate Losses.`],
["filing-a-loss","Filing","Filing a Loss","Chapter 9 describes how to submit a Declaration of Loss.",`
## The form
9.1 Losses are filed using Form GRC-L1, accessed through any File a Loss button.
9.2 The form asks for two items.
| Field | Options |
| Trigger of loss | Spontaneous, Visual, Verbal, or Corporate (selected by default) |
| Declaration of loss | Nonverbal or Verbal |
## Submission
9.3 Submission is final. Filings may not be edited or withdrawn.
9.4 Upon submission, a confirmation number in the format GRC-000000-L is issued.
9.5 The time of the filing is recorded automatically.
9.6 The approximate location of the filing is recorded from the Declarant’s IP address.
9.7 A filing adds one to the global count and is displayed on the Loss map.
9.8 Where a Loss is noticed on arrival at the website, the form may be presented automatically. It must be completed to proceed.`],
["daily-limit","Filing","Daily filing limit","Chapter 10 limits the number of filings per day.",`
10.1 Each person may file one Loss per calendar day.
10.2 The File a Loss button is unavailable after a filing is made.
10.3 The limit resets at midnight, local time. A new filing may be made immediately afterward.
10.4 Further Losses on the same day are noted by the Declarant, but are not recorded.
10.5 Clearing a browser or switching devices does not constitute a new day.
10.6 Attempts to exceed the limit are treated as Losses.`],
["unfiled-losses","Filing","Unfiled Losses and statistics","Chapter 11 explains how published figures are derived.",`
11.1 Published figures reflect Filed Losses only.
11.2 The true number of Losses is believed to be considerably higher than the number filed.
11.3 Counts are updated periodically, and may be delayed or rounded.
11.4 The Loss map displays a sample of recent filings. It does not display every filing.
11.5 Locations are approximated from IP address and may be imprecise.
11.6 Location data is used only to display the map and is not linked to the Declarant by name.
11.7 The Corporation has not verified any win. The Wins counter remains at zero.
> Unfiled Losses are real. They are simply unrecorded.`],
["extensions","Special circumstances","Exemptions and extensions","Chapter 12 covers circumstances in which the ordinary rules are relaxed.",`
12.1 During a medical procedure, an examination, a funeral, or a court proceeding, Premature Loss rules are suspended.
12.2 Persons in these circumstances may request an extended Grace Period from the Grace Period Authority.
12.3 An extension carries the Grace Period beyond midnight, up to the end of the circumstance.
12.4 Requests must state the circumstance and the expected duration.
12.5 Emergencies take precedence over declarations. Declare afterward.
12.6 No extension is granted on grounds of being busy, tired, or distracted.`],
["groups","Special circumstances","Groups and Mass Losses","Chapter 13 covers Losses affecting many persons at once.",`
13.1 A Mass Loss occurs when many persons lose within a short interval, typically after a Declaration in a crowded space.
13.2 Each affected person must declare individually.
13.3 Classrooms, offices, stadiums, and broadcasts are all recognized settings.
13.4 A person whose Declaration causes a Mass Loss is not liable, but is encouraged to apologize.
13.5 Mass Losses are reported to Distribution &amp; Awareness for statistical purposes.`],
["media","Special circumstances","Media and public display","Chapter 14 covers The Game in written, visual, and digital form.",`
14.1 Websites, posts, videos, signage, and merchandise that mention The Game are Inadvertent Reminders.
14.2 Authors of reminders are not liable for Losses caused by them.
14.3 The Corporation’s own communications may cause Corporate Losses. This is an unavoidable cost of operation.
14.4 A reference to The Game is a reminder regardless of its tone.
14.5 Persons who deliberately seek out reminders should declare when they find one.`],
["minors","Special circumstances","Minors and vulnerable persons","Chapter 15 covers participants who may need additional consideration.",`
15.1 Minors are participants. Participation does not depend on age.
15.2 A guardian may assist a minor in filing a Loss.
15.3 Persons who are unwell or recovering should not be pressed to declare. Their Grace Period still applies.
15.4 Hospitals, schools, and care facilities may post notices describing their local practices. Such notices do not limit this Rulebook.`],
["disputes","Enforcement","Disputes and appeals","Chapter 16 describes how Loss disputes are heard.",`
16.1 Disputes are heard by the Ethics &amp; Appeals Board.
16.2 A dispute must state what was thought, when, and why it should not be a Loss.
16.3 Decisions are issued in the order in which disputes were lost.
16.4 A decision of the Board may be appealed. The appeal is heard by the same Board.
## Common claims
| Claim | Disposition |
| “I almost forgot.” | Rejected. See Rule 3.10. |
| “I was thinking about not thinking about it.” | Rejected. See Rule 3.4. |
| “I did not know I was playing.” | Rejected. See Rule 2.5. |
| “I was only quoting.” | Rejected. See Rule 3.6. |
| “I declared it already.” | Under review. |`],
["winning","Enforcement","Winning","Chapter 17 addresses claims of victory.",`
17.1 Winning is theoretically possible.
17.2 No claim has been verified.
17.3 Claims are referred to the Department of Impossible Appeals.
17.4 A person who believes they have won must not tell anyone, as this would prompt others to lose.
17.5 Any victory is reversed by the person’s next thought about The Game.
17.6 The Wins counter will be updated if and when the Board is satisfied.`],
["penalties","Enforcement","Penalties and fines","Chapter 18 describes sanctions for violations.",`
| Violation | Penalty |
| Failure to declare | A formal reminder |
| Making a false Declaration | Loss of the Grace Period |
| Deliberate Premature Loss | Mandatory compliance reading |
| Interfering with Inadvertent Reminders | Fine, payable in unthinking |
| Attempting to resign | Noted |
18.1 Fines are symbolic.
18.2 Penalties are administered by the Department of Losses.
18.3 No penalty may exceed the inconvenience of the violation.`],
["amendments","Enforcement","Amendments","Chapter 19 describes how this document changes.",`
19.1 The Constitution may not be amended.
19.2 The Rulebook may be revised by the Corporation without notice.
19.3 Revisions take effect retroactively.
## Version history
| Version | Summary |
